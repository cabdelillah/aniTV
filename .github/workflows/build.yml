name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Android & Android TV APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test core
        run: ./gradlew :core:desktopTest
      - name: Set up release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersion=$APP_VERSION
          cp androidApp/build/outputs/apk/release/*.apk aniTV.apk
      - uses: actions/upload-artifact@v5
        with:
          name: aniTV-android
          path: aniTV.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build DMG
        run: |
          ./gradlew :desktopApp:packageDmg -PdesktopOnly=true -PappVersion=$APP_VERSION
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg aniTV.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: aniTV-macos
          path: aniTV.dmg

  # Every successful build of the default branch becomes the latest GitHub Release, so
  # https://github.com/<owner>/<repo>/releases/latest/download/aniTV.apk always points at it.
  release:
    name: Publish release
    needs: [android, macos]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" aniTV.apk aniTV.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "aniTV $APP_VERSION" \
            --latest \
            --notes "Automatic build of ${GITHUB_SHA::7}.

          - **aniTV.apk**: Android phones, tablets and Android TV
          - **aniTV.dmg**: macOS on Apple Silicon (needs \`brew install mpv\`)"
