name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android & Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Show available Android tooling versions
        run: |
          for a in com/android/tools/build/gradle com/android/kotlin/multiplatform/library/com.android.kotlin.multiplatform.library.gradle.plugin androidx/media3/media3-exoplayer androidx/tv/tv-material androidx/activity/activity-compose; do
            echo "$a: $(curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tail -8 | tr '\n' ' ')"
          done
          ls "$ANDROID_HOME/platforms" || true
      - name: Test core
        run: ./gradlew :core:desktopTest
      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aniTV-android
          path: androidApp/build/outputs/apk/release/*.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg -PdesktopOnly=true
      - uses: actions/upload-artifact@v4
        with:
          name: aniTV-macos
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
