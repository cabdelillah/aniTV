name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android & Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew :core:desktopTest
      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aniTV-android
          path: androidApp/build/outputs/apk/release/*.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        run: ./gradlew :desktopApp:packageDmg -PdesktopOnly=true
      - uses: actions/upload-artifact@v4
        with:
          name: aniTV-macos
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
