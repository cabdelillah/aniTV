name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Android & Android TV APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test core
        run: ./gradlew :core:desktopTest
      - name: Set up release signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersion=$APP_VERSION
          cp androidApp/build/outputs/apk/release/*.apk aniTV.apk
      - uses: actions/upload-artifact@v5
        with:
          name: aniTV-android
          path: aniTV.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build DMG
        run: |
          ./gradlew :desktopApp:packageDmg -PdesktopOnly=true -PappVersion=$APP_VERSION
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg aniTV.dmg
      - name: List JDK modules the app needs
        run: ./gradlew :desktopApp:suggestRuntimeModules -PdesktopOnly=true | grep -A3 -i "suggested"
      - uses: actions/upload-artifact@v5
        with:
          name: aniTV-macos
          path: aniTV.dmg
      - name: Self-test the packaged app (network + real mpv playback)
        run: |
          brew install mpv
          hdiutil attach aniTV.dmg -mountpoint /Volumes/aniTV -nobrowse
          mkdir -p e2e
          ANITV_SELFTEST=1 /Volumes/aniTV/aniTV.app/Contents/MacOS/aniTV 2>&1 | tee e2e/mac-selftest.txt
          grep -q "SELFTEST RESULT OK" e2e/mac-selftest.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-macos
          path: e2e/

  phone-e2e:
    name: Phone emulator test
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: aniTV-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: scripts/e2e-android.sh phone aniTV.apk e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-phone
          path: e2e/

  tv-e2e:
    name: Android TV emulator test
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: aniTV-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: scripts/e2e-android.sh tv aniTV.apk e2e
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-tv
          path: e2e/

  # Screenshots and logs from the device tests, published as a pre-release so they can be
  # inspected without downloading workflow artifacts. Replaced on every default-branch build.
  diagnostics:
    name: Publish test diagnostics
    needs: [phone-e2e, tv-e2e, macos]
    if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: e2e-*
          merge-multiple: true
          path: e2e
      - name: Replace the ci-diagnostics pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la e2e
          gh release delete ci-diagnostics --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create ci-diagnostics e2e/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "CI diagnostics" \
            --notes "Screenshots, self-test output and logs from the device tests of ${GITHUB_SHA::7}. Not an app release."

  # Every successful build of the default branch becomes the latest GitHub Release, so
  # https://github.com/<owner>/<repo>/releases/latest/download/aniTV.apk always points at it.
  release:
    name: Publish release
    needs: [android, macos, phone-e2e]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" aniTV.apk aniTV.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "aniTV $APP_VERSION" \
            --latest \
            --notes "Automatic build of ${GITHUB_SHA::7}.

          - **aniTV.apk**: Android phones, tablets and Android TV
          - **aniTV.dmg**: macOS on Apple Silicon (needs \`brew install mpv\`)"
